[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create"
  to = "/.netlify/functions/create"
  status = 200

[[redirects]]
  from = "/api/resolve"
  to = "/.netlify/functions/resolve"
  status = 200

[[redirects]]
  from = "/api/consent"
  to = "/.netlify/functions/consent"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/s/*"
  to = "/short.html?code=:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
