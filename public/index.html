<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JuttShortLink</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header><div class="logo">JS</div><div><h1>JuttShortLink</h1><p class="muted">Create clean, shareable short links</p></div></header>
<section class="panel"><h2>Create a short link</h2><label>Destination URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required><button id="make">Generate short link</button><p id="msg" class="muted"></p><div id="result" hidden><label>Your short link</label><div class="inline"><input id="short" readonly><button id="copy" class="secondary">Copy</button></div></div></section>
<footer>Visitors choose whether to share location or use camera/microphone. Denying permissions never blocks the destination.</footer></main><script src="/app.js"></script></body></html>
