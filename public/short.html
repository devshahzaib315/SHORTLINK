<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continue to destination</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><section class="panel"><h2>Before you continue</h2><p class="muted">You can share your location or choose to use your camera and microphone. Each choice is optional. Denying any permission will not stop you from opening the destination.</p><div id="loc" class="status">📍 Location: Not shared</div><button id="getloc">Share my location</button><div class="status">📷 Camera: Optional</div><button id="cam">Open camera</button><video id="video" autoplay playsinline class="hidden"></video><div class="actions"><button id="snap" class="hidden">Take photo</button></div><div id="photo"></div><div class="status">🎙️ Microphone: Optional</div><button id="mic">Start microphone recording</button><button id="stop" class="secondary hidden">Stop recording</button><p id="audioState" class="small"></p><p id="notice" class="small"></p><button id="continue">Continue to destination</button></section></main><script src="/short.js"></script></body></html>
